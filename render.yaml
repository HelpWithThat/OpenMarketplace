services:
  - type: web
    name: open-marketplace
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: open-marketplace-db
          property: connectionString
      - key: APP_URL
        sync: false

databases:
  - name: open-marketplace-db
    plan: free
